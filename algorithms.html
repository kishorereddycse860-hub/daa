<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algorithms — SortLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <div class="bgfx-layer" id="bgfxLayer"></div>
  <div class="page-transition-overlay" id="ptOverlay"></div>

  <header class="site-header">
    <div class="logo"><span class="mark">S</span> SortLab</div>
    <div class="breadcrumb">
      <a href="index.html">Home</a><span class="sep">/</span><span class="current">Algorithms</span>
    </div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="algorithms.html">Algorithms</a>
    </nav>
  </header>

  <main class="page">
    <div class="page-heading">
      <h1>Choose an Algorithm</h1>
      <p>Six classical sorting algorithms — pick one to read how it works, then jump into the interactive visualizer.</p>
    </div>

    <div class="algo-grid" id="algoGrid"></div>
  </main>

  <footer class="site-footer">
    <span>SortLab · Built with HTML / CSS / vanilla JS</span>
    <span>6 algorithms available</span>
  </footer>

<script src="assets/data.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    const grid = document.getElementById('algoGrid');
    ALGO_LIST.forEach((slug, idx) => {
      const algo = ALGO_DATA[slug];
      const card = document.createElement('a');
      card.href = `algorithm.html?algo=${slug}`;
      card.className = 'blueprint-panel algo-card';
      card.innerHTML = `
        <div class="index">0${idx+1}</div>
        <h3>${algo.name}</h3>
        <div class="tagline">${algo.tagline}</div>
        <div class="go">View details →</div>
      `;
      grid.appendChild(card);
    });
  });
</script>

<script src="assets/tunnelfx.js"></script>
<script src="assets/bgfx.js"></script>
<script src="assets/corridorfx.js"></script>
<script src="assets/transitions.js"></script>
</body>
</html>
